[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payops-sentinel"
version = "0.1.0"
description = "Fraud-ring investigation console: ring-level detection, evidence assembly and a measured label pipeline"
requires-python = ">=3.11"
readme = "README.md"

# Runtime dependencies are pinned loosely and mirrored in requirements.txt,
# which remains the file the run scripts use. Two facts worth keeping visible:
# `snapml` 1.15.6 installs and imports fine on this Windows Python 3.11 venv --
# it is not absent. What has no Windows build at any snapml version is the
# Graph Feature Preprocessor's native half: constructing
# `GraphFeaturePreprocessor()` raises AttributeError because none of the
# Windows .pyd binaries export a `gf_*` symbol (see scripts/gfp_control.py).
# That is why no GFP parity control can run on this machine; it is not a
# Python-version problem and a newer interpreter cannot fix it. `lightgbm` is
# required only by the evaluation scripts, never by the detector.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "networkx",
    "scikit-learn",
    "python-igraph",
    "leidenalg",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
eval = ["lightgbm>=4.7"]
dev = ["pytest", "pytest-timeout"]

[tool.setuptools]
packages = ["sentinel"]

[tool.pytest.ini_options]
# `scripts` is importable from the repo root as a namespace package; several
# tests exercise evaluation-script logic directly, which is deliberate -- the
# scripts hold real decisions (the train/test split, the hit rule) and those
# must be tested rather than only run.
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "needs_stream: requires the compiled AMLworld stream in data/stream",
    "slow: takes more than a few seconds",
]
filterwarnings = ["error::SyntaxWarning"]
